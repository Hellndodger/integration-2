name: lab2-container-ci

on:
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint
        shell: powershell
        run: |
          python -m pip install ruff
          ruff check lab2/src lab2/scripts

      - name: Build multi-stage image
        shell: powershell
        run: |
          docker build `
            --build-arg EPOCHS=3 `
            --build-arg MODEL_VERSION=1.0.0 `
            --build-arg "VCS_REF=$env:GITHUB_SHA" `
            --build-arg "BUILD_DATE=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))" `
            -t "kws-api:$env:GITHUB_SHA" `
            -f lab2/Dockerfile lab2

      - name: Run container
        shell: powershell
        run: |
          docker rm -f kws 2>$null
          docker run -d --name kws -p 8000:8000 "kws-api:$env:GITHUB_SHA"

      - name: Wait for healthy API
        shell: powershell
        run: |
          $deadline = (Get-Date).AddSeconds(120)
          do {
            try {
              $response = Invoke-RestMethod http://127.0.0.1:8000/health -TimeoutSec 3
              if ($response.status -eq "ok") {
                Write-Host "API is ready."
                exit 0
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          } while ((Get-Date) -lt $deadline)

          docker logs kws
          throw "API did not become ready within 120 seconds."

      - name: Smoke test API and accuracy gate
        shell: powershell
        run: |
          $info = Invoke-RestMethod http://127.0.0.1:8000/model-info -TimeoutSec 10
          if ($info.accuracy -lt 45) {
            throw "Accuracy gate failed: $($info.accuracy)% is below 45%."
          }
          if ($info.model_size_kb -le 0) {
            throw "Model size must be greater than zero."
          }

          $predictionText = & curl.exe --fail --silent --show-error `
            -F "file=@lab1/samples/yes.wav" `
            http://127.0.0.1:8000/predict
          if ($LASTEXITCODE -ne 0) {
            throw "Prediction request failed."
          }
          $prediction = $predictionText | ConvertFrom-Json
          $labels = @("yes", "no", "up", "down")
          if ($prediction.label -notin $labels) {
            throw "Unexpected prediction label: $($prediction.label)"
          }
          if ($prediction.confidence -lt 0 -or $prediction.confidence -gt 1) {
            throw "Prediction confidence is outside the [0, 1] range."
          }
          if ($prediction.latency_ms -le 0) {
            throw "Prediction latency must be greater than zero."
          }
          foreach ($label in $labels) {
            if ($null -eq $prediction.probabilities.$label) {
              throw "Prediction response is missing probability for '$label'."
            }
          }

          Write-Host "Accuracy: $($info.accuracy)%"
          Write-Host ($prediction | ConvertTo-Json -Compress)

      - name: Show image and runtime sizes
        if: always()
        shell: powershell
        run: |
          docker images kws-api
          docker stats --no-stream kws

      - name: Logs on failure
        if: failure()
        shell: powershell
        run: docker logs kws

      - name: Stop container
        if: always()
        shell: powershell
        run: docker rm -f kws 2>$null

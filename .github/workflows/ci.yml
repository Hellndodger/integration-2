name: ML CI/CD pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs
        type: number
        default: 4
        required: true
      limit_per_class:
        description: Maximum training examples per class and split
        type: number
        default: 50
        required: true
      publish:
        description: Publish the verified image to GHCR
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ruff and Python syntax in Docker
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --env PYTHONPYCACHEPREFIX=/tmp/pycache \
            --env RUFF_CACHE_DIR=/tmp/ruff_cache \
            --entrypoint sh \
            python:3.11-slim-bookworm \
            -c 'pip install --no-cache-dir ruff==0.11.8 && ruff check lab2/src lab2/scripts lab3/scripts && python -m compileall -q lab2/src lab2/scripts lab3/scripts'

  pipeline:
    needs: lint
    if: needs.lint.result == 'success'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      EPOCHS: ${{ inputs.epochs || 4 }}
      LIMIT_PER_CLASS: ${{ inputs.limit_per_class || 50 }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare output and persistent dataset cache
        run: |
          mkdir -p lab3/artifacts "$HOME/.cache/speechcommands"

      - name: Build trainer image
        run: docker build --target trainer --tag speech-lab3-trainer:${GITHUB_SHA} --file lab3/Dockerfile .

      - name: Train and evaluate inside Docker
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$HOME/.cache/speechcommands:/data" \
            --volume "$GITHUB_WORKSPACE/lab3/artifacts:/artifacts" \
            speech-lab3-trainer:${GITHUB_SHA} \
            --data-root /data \
            --output-dir /artifacts \
            --epochs "$EPOCHS" \
            --limit-per-class "$LIMIT_PER_CLASS" \
            --seed 42 \
            --model-version "3.0.${GITHUB_RUN_NUMBER}" \
            --git-commit "$GITHUB_SHA" \
            2>&1 | tee lab3/artifacts/train.log

      - name: Check required training outputs
        run: |
          test -s lab3/artifacts/model.pt
          test -s lab3/artifacts/labels.json
          test -s lab3/artifacts/metrics.json
          cat lab3/artifacts/metrics.json

      - name: Prepare held-out golden samples
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$HOME/.cache/speechcommands:/data:ro" \
            --workdir /workspace \
            --entrypoint python \
            speech-lab3-trainer:${GITHUB_SHA} \
            /workspace/lab3/scripts/prepare_golden.py \
            --data-root /data \
            --manifest /workspace/lab3/golden/expected.json \
            --output /workspace/lab3/artifacts/golden

      - name: Remove trainer image
        if: always()
        run: docker image rm speech-lab3-trainer:${GITHUB_SHA} >/dev/null 2>&1 || true

      - name: Build runtime image from trained artifacts
        run: |
          docker build --target runtime \
            --build-arg MODEL_VERSION="3.0.${GITHUB_RUN_NUMBER}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag speech-lab3-api:${GITHUB_SHA} \
            --file lab3/Dockerfile .

      - name: Start API container
        run: |
          docker rm -f speech-lab3-api >/dev/null 2>&1 || true
          docker run --detach --name speech-lab3-api \
            --publish 8000:8000 \
            speech-lab3-api:${GITHUB_SHA}

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs speech-lab3-api
          exit 1

      - name: Measure latency in the runtime image
        run: |
          docker run --rm \
            --network container:speech-lab3-api \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --user "$(id -u):$(id -g)" \
            --entrypoint python \
            speech-lab3-api:${GITHUB_SHA} \
            lab2/scripts/benchmark.py \
            --url http://127.0.0.1:8000 \
            --n 30 \
            --warmup 5 \
            --sample lab3/artifacts/golden/yes.wav \
            --out lab3/artifacts/latency.json

      - name: Verify API, golden samples, and quality gates
        run: |
          docker run --rm \
            --network container:speech-lab3-api \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --user "$(id -u):$(id -g)" \
            --entrypoint python \
            speech-lab3-api:${GITHUB_SHA} \
            lab3/scripts/verify.py \
            --url http://127.0.0.1:8000 \
            --samples lab3/artifacts/golden \
            --metrics lab3/artifacts/metrics.json \
            --latency lab3/artifacts/latency.json \
            --output lab3/artifacts/verification.json \
            --min-accuracy 45 \
            --max-p95-ms 5000

      - name: Stop API container
        if: always()
        run: docker rm -f speech-lab3-api >/dev/null 2>&1 || true

      - name: Remove verification runtime image
        if: always()
        run: docker image rm speech-lab3-api:${GITHUB_SHA} >/dev/null 2>&1 || true

      - name: Build runtime image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build --target runtime \
            --build-arg MODEL_VERSION="3.0.${GITHUB_RUN_NUMBER}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --file lab3/Dockerfile .
          docker images "${IMAGE}"
          docker history --no-trunc "${IMAGE}:${GITHUB_SHA}" \
            | tee lab3/artifacts/docker-history.txt

      - name: Log in to GitHub Container Registry
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        id: publish
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi

      - name: Create pipeline report and Job Summary
        run: |
          PUBLISHED=false
          if [[ "${{ steps.publish.outcome }}" == "success" ]]; then PUBLISHED=true; fi
          IMAGE_SIZE="$(docker image ls --format='{{.Size}}' "${IMAGE}:${GITHUB_SHA}")"
          export IMAGE_SIZE PUBLISHED
          printf '{"size_display":"%s","published":%s}\n' "$IMAGE_SIZE" "$PUBLISHED" \
            > lab3/artifacts/image-info.json
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --user "$(id -u):$(id -g)" \
            --entrypoint python \
            "${IMAGE}:${GITHUB_SHA}" \
            lab3/scripts/write_summary.py --image "${IMAGE}:${GITHUB_SHA}" \
            --output lab3/artifacts/ci-report.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove local published-image tags
        if: always()
        run: |
          docker image rm "${IMAGE}:${GITHUB_SHA}" >/dev/null 2>&1 || true
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            docker image rm "${IMAGE}:latest" >/dev/null 2>&1 || true
          fi

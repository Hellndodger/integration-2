name: lab2-container-ci

on:
  push:
    paths:
      - "lab2/**"
      - "lab1/samples/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "lab2/**"
      - "lab1/samples/**"
      - ".github/workflows/ci.yml"

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint
        run: |
          python -m pip install ruff
          ruff check lab2/src lab2/scripts

      - name: Build multi-stage image
        run: |
          docker build \
            --build-arg EPOCHS=3 \
            --build-arg MODEL_VERSION=1.0.0 \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t kws-api:${GITHUB_SHA} \
            -f lab2/Dockerfile lab2

      - name: Run container
        run: docker run -d --name kws -p 8000:8000 kws-api:${GITHUB_SHA}

      - name: Wait for healthy API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs kws
          exit 1

      - name: Smoke test API and accuracy gate
        run: |
          curl --fail --silent http://127.0.0.1:8000/model-info -o model-info.json
          curl --fail --silent \
            -F "file=@lab1/samples/yes.wav" \
            http://127.0.0.1:8000/predict -o prediction.json
          python - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path("model-info.json").read_text())
          prediction = json.loads(Path("prediction.json").read_text())
          assert info["accuracy"] >= 45, f"accuracy gate failed: {info['accuracy']}%"
          assert info["model_size_kb"] > 0
          assert prediction["label"] in {"yes", "no", "up", "down"}
          assert 0 <= prediction["confidence"] <= 1
          assert prediction["latency_ms"] > 0
          assert set(prediction["probabilities"]) == {"yes", "no", "up", "down"}
          print(f"accuracy={info['accuracy']}%, prediction={prediction}")
          PY

      - name: Show image and runtime sizes
        if: always()
        run: |
          docker images kws-api || true
          docker stats --no-stream kws || true

      - name: Logs on failure
        if: failure()
        run: docker logs kws

      - name: Stop container
        if: always()
        run: docker rm -f kws || true
